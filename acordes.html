    <style>
        /* ===== ESTILOS GERAIS ===== */
        body {
            background: #0e0d1a;
            color: #e4dfd7;
            font-family: 'Inter', sans-serif;
            padding-top: 70px;
        }
        .gold {
            color: #c9a959;
        }
        .bg-dark-custom {
            background: #14131f;
        }
        .border-gold {
            border-color: rgba(201, 169, 89, 0.2);
        }
        .text-gold {
            color: #c9a959;
        }

        .navbar-custom {
            background: #0e0d1aee;
            backdrop-filter: blur(6px);
            border-bottom: 1px solid rgba(201, 169, 89, 0.08);
        }
        .navbar-custom .nav-link {
            color: #b5b0a8 !important;
            font-weight: 400;
            letter-spacing: 0.3px;
        }
        .navbar-custom .nav-link:hover,
        .navbar-custom .nav-link.active {
            color: #e8d5a3 !important;
        }
        .nav-brand-title {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #e8d5a3 !important;
        }
        .nav-brand-title span {
            color: #c9a959;
        }

        .chapter-content {
            padding: 2rem 0 3rem;
        }
        .section-tag {
            display: inline-block;
            background: rgba(201, 169, 89, 0.08);
            color: #c9a959;
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.8px;
            padding: 4px 16px;
            border-radius: 30px;
            border: 1px solid rgba(201, 169, 89, 0.08);
            text-transform: uppercase;
        }

        /* ===== FILTROS ===== */
        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 10px;
            margin: 18px 0 22px;
            justify-content: center;
        }
        .filter-group .btn-filter {
            padding: 6px 18px;
            border: 1px solid rgba(201, 169, 89, 0.08);
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.02);
            color: #b5b0a8;
            font-size: 0.65rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        .filter-group .btn-filter:hover,
        .filter-group .btn-filter.active {
            border-color: #c9a959;
            color: #e8d5a3;
            background: rgba(201, 169, 89, 0.08);
        }

        /* ===== CARDS ===== */
        .card-chord {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(201, 169, 89, 0.06);
            border-radius: 14px;
            padding: 12px 8px;
            text-align: center;
            cursor: pointer;
            transition: 0.25s;
            height: 100%;
            position: relative;
        }
        .card-chord:hover {
            border-color: rgba(201, 169, 89, 0.2);
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.04);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .card-chord .chord-name {
            font-family: 'Playfair Display', serif;
            font-size: 0.95rem;
            color: #e8d5a3;
            font-weight: 600;
            margin-top: 6px;
        }
        .card-chord .chord-notes {
            font-size: 0.6rem;
            color: #b5b0a8;
            letter-spacing: 0.3px;
        }
        .card-chord .chord-badge {
            position: absolute;
            top: 6px;
            right: 6px;
            font-size: 0.45rem;
            background: rgba(201, 169, 89, 0.1);
            color: #c9a959;
            padding: 2px 10px;
            border-radius: 30px;
            border: 1px solid rgba(201, 169, 89, 0.05);
            text-transform: uppercase;
        }
        .card-chord .svg-wrapper {
            display: block;
            width: 100%;
        }
        .card-chord .svg-wrapper svg {
            width: 100%;
            height: auto;
            max-height: 140px;
            border-radius: 6px;
            background: rgba(0,0,0,0.2);
            padding: 3px;
            border: 1px solid rgba(201, 169, 89, 0.05);
        }

        /* ===== MODAL ===== */
        .modal-custom {
            background: rgba(15, 14, 26, 0.96) !important;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(201, 169, 89, 0.15) !important;
            border-radius: 16px;
        }
        .modal-custom .modal-svg-container svg {
            width: 100%;
            max-height: 70vh;
            border-radius: 8px;
            background: rgba(0,0,0,0.2);
            padding: 6px;
            border: 1px solid rgba(201, 169, 89, 0.08);
        }

        /* ===== TOGGLE BUTTON ===== */
        .toggle-view {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 12px 0 18px;
        }
        .toggle-view .btn-toggle {
            padding: 8px 24px;
            border: 1px solid rgba(201, 169, 89, 0.15);
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.02);
            color: #b5b0a8;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        .toggle-view .btn-toggle:hover,
        .toggle-view .btn-toggle.active {
            border-color: #c9a959;
            color: #e8d5a3;
            background: rgba(201, 169, 89, 0.08);
        }

        /* ===== FOOTER ===== */
        .site-footer {
            border-top: 1px solid rgba(201, 169, 89, 0.05);
            background: #0e0d1a;
            padding: 1.5rem 0;
            margin-top: 2rem;
        }
        .site-footer .footer-brand {
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            color: #c9a959;
        }
        .site-footer .footer-brand span {
            color: #e8d5a3;
        }
        .btn-close-white {
            filter: invert(1);
        }

        /* responsivo */
        @media (max-width: 576px) {
            body {
                padding-top: 62px;
            }
            .chapter-content {
                padding: 1.25rem 0 2rem;
            }
            .chapter-content h1 {
                font-size: 1.8rem;
                margin-bottom: 0.5rem;
            }
            .chapter-content .text-muted {
                margin-bottom: 0.9rem;
            }
            .toggle-view {
                gap: 8px;
                margin: 10px 0 14px;
                flex-wrap: wrap;
            }
            .card-chord .svg-wrapper svg {
                max-height: 100px;
            }
            .filter-group .btn-filter {
                font-size: 0.55rem;
                padding: 4px 12px;
            }
            .toggle-view .btn-toggle {
                font-size: 0.65rem;
                padding: 6px 16px;
            }
            .chapter-nav {
                margin-top: 2rem !important;
                gap: 10px;
            }
            .chapter-nav a {
                width: 100%;
                min-width: 0;
                padding: 10px 12px;
            }
            .chapter-nav a.text-end {
                text-align: left !important;
            }
        }

        @media (max-width: 430px) {
            .chapter-content h1 {
                font-size: 1.55rem;
            }
            .filter-group {
                margin: 12px 0 16px;
                gap: 6px 8px;
            }
            .filter-group .btn-filter {
                padding: 4px 10px;
            }
            .card-chord {
                padding: 10px 7px;
            }
            .card-chord .chord-name {
                font-size: 0.86rem;
            }
        }

        @media (max-width: 390px) {
            .row.g-3 {
                --bs-gutter-x: 0.6rem;
                --bs-gutter-y: 0.6rem;
            }
            .toggle-view {
                margin: 8px 0 12px;
            }
            .toggle-view .btn-toggle {
                width: 100%;
            }
        }

        @media (max-width: 360px) {
            .filter-group {
                gap: 6px;
            }
            .toggle-view .btn-toggle {
                width: 100%;
            }
        }

        /* ===== SELETOR DE POSIÇÕES (modal de escala) ===== */
        .btn-posicao {
            padding: 5px 14px;
            border: 1px solid rgba(201, 169, 89, 0.15);
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.02);
            color: #b5b0a8;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-posicao.active {
            border-color: #c9a959;
            color: #0a0a0a;
            background: #c9a959;
        }
    </style>
</head>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>

    <script>
        // ================================================================
        //  BIBLIOTECA UNIFICADA – ACORDES + ESCALAS
        // ================================================================

        const NOTAS = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        const AFINACAO = ["E", "A", "D", "G", "B", "E"];

        // ---------- ACORDES (seleção expandida) ----------
        const ACORDES_BIBLIOTECA = {};

        function shape(baseFret, dots, status, barre = null, nome = '') {
            return { baseFret, dots, status, barre, nome };
        }

        // Maior
        ACORDES_BIBLIOTECA["Maior"] = {
            "C": [shape(1, [[2,3,3,"C"],[3,2,2,"E"],[5,1,1,"C"]], ["x","o","o","o","o","o"], null, "aberto")],
            "D": [shape(1, [[4,2,1,"D"],[5,3,3,"A"],[6,2,2,"F#"]], ["x","x","o","o","o","o"], null, "aberto")],
            "E": [shape(1, [[2,2,2,"B"],[3,2,3,"E"],[4,1,1,"G#"]], ["o","o","o","o","o","o"], null, "aberto")],
            "F": [shape(1, [[2,3,3,"C"],[3,3,4,"F"],[4,2,2,"A"]], ["o","o","o","o","o","o"], {fret:1,from:1,to:6}, "barre")],
            "G": [shape(1, [[1,3,2,"G"],[2,2,1,"B"],[6,3,3,"G"]], ["o","o","o","o","o","o"], null, "aberto")],
            "A": [shape(1, [[3,2,1,"E"],[4,2,2,"A"],[5,2,3,"C#"]], ["x","o","o","o","o","o"], null, "aberto")],
            "B": [shape(2, [[3,3,2,"F#"],[4,3,3,"B"],[5,3,4,"D#"]], ["x","o","o","o","o","o"], {fret:1,from:2,to:6}, "barre")]
        };
        // Menor
        ACORDES_BIBLIOTECA["Menor"] = {
            "C": [shape(3, [[3,3,3,"G"],[4,3,4,"C"],[5,2,2,"D#"]], ["x","o","o","o","o","o"], {fret:1,from:2,to:6}, "barre")],
            "D": [shape(1, [[4,2,2,"D"],[5,3,3,"A"],[6,1,1,"F"]], ["x","x","o","o","o","o"], null, "aberto")],
            "E": [shape(1, [[2,2,2,"B"],[3,2,3,"E"]], ["o","o","o","o","o","o"], null, "aberto")],
            "F": [shape(1, [[2,3,3,"C"],[3,3,4,"F"],[4,1,1,"G#"]], ["o","o","o","o","o","o"], {fret:1,from:1,to:6}, "barre")],
            "G": [shape(3, [[2,3,3,"D"],[3,3,4,"G"],[4,1,1,"A#"]], ["o","o","o","o","o","o"], {fret:1,from:1,to:6}, "barre")],
            "A": [shape(1, [[3,2,2,"E"],[4,2,3,"A"],[5,1,1,"C"]], ["x","o","o","o","o","o"], null, "aberto")],
            "B": [shape(2, [[3,3,3,"F#"],[4,3,4,"B"],[5,2,2,"D"]], ["x","o","o","o","o","o"], {fret:1,from:2,to:6}, "barre")]
        };
        // Sétima
        ACORDES_BIBLIOTECA["Sétima (7)"] = {
            "C": [shape(1, [[2,3,3,"C"],[3,2,2,"E"],[4,3,4,"A#"],[5,1,1,"C"]], ["x","o","o","o","o","o"], null, "aberto")],
            "D": [shape(1, [[4,2,1,"D"],[5,1,2,"C"],[6,2,3,"F#"]], ["x","x","o","o","o","o"], null, "aberto")],
            "E": [shape(1, [[2,2,2,"B"],[4,1,1,"G#"]], ["o","o","o","o","o","o"], null, "aberto")],
            "G": [shape(1, [[1,3,3,"G"],[2,2,2,"B"],[6,1,1,"F"]], ["o","o","o","o","o","o"], null, "aberto")],
            "A": [shape(1, [[3,2,1,"E"],[5,2,2,"G"]], ["x","o","o","o","o","o"], null, "aberto")],
            "B": [shape(2, [[3,3,3,"F#"],[5,3,4,"E"]], ["x","o","o","o","o","o"], {fret:1,from:2,to:6}, "barre")]
        };
        // Sétima Maior
        ACORDES_BIBLIOTECA["Sétima Maior (7M)"] = {
            "C": [shape(1, [[2,3,3,"C"],[3,2,2,"E"]], ["x","o","o","o","o","o"], null, "aberto")],
            "D": [shape(1, [[4,2,1,"D"],[5,2,1,"C#"],[6,2,1,"F#"]], ["x","x","o","o","o","o"], null, "aberto")],
            "E": [shape(1, [[2,2,2,"B"],[3,1,1,"D#"],[4,1,1,"G#"]], ["o","o","o","o","o","o"], null, "aberto")],
            "G": [shape(1, [[1,3,2,"G"],[6,2,1,"F#"]], ["o","x","o","o","o","o"], null, "aberto")],
            "A": [shape(1, [[3,2,1,"E"],[4,1,2,"G#"],[5,2,3,"C#"]], ["x","o","o","o","o","o"], null, "aberto")],
            "B": [shape(2, [[3,3,3,"F#"],[4,2,2,"B"],[5,1,1,"A#"]], ["x","o","o","o","o","o"], {fret:1,from:2,to:6}, "barre")]
        };
        // Suspenso 4
        ACORDES_BIBLIOTECA["Suspenso 4 (sus4)"] = {
            "C": [shape(1, [[2,3,3,"C"],[3,3,4,"F"],[5,1,1,"C"]], ["x","o","o","o","o","o"], null, "aberto")],
            "D": [shape(1, [[4,2,1,"D"],[5,3,2,"A"],[6,3,3,"G"]], ["x","x","o","o","o","o"], null, "aberto")],
            "E": [shape(1, [[2,2,2,"B"],[3,2,3,"E"],[4,2,4,"A"]], ["o","o","o","o","o","o"], null, "aberto")],
            "G": [shape(1, [[1,3,3,"G"],[2,3,4,"C"],[6,3,2,"G"]], ["o","o","o","o","o","o"], null, "aberto")],
            "A": [shape(1, [[3,2,1,"E"],[4,2,2,"A"],[5,3,3,"D"]], ["x","o","o","o","o","o"], null, "aberto")],
            "B": [shape(2, [[3,4,3,"F#"],[4,4,4,"B"],[5,3,2,"E"]], ["x","o","o","o","o","o"], {fret:1,from:2,to:6}, "barre")]
        };
        // Diminuto
        ACORDES_BIBLIOTECA["Diminuto (m♭5)"] = {
            "C": [shape(1, [[4,1,1,"D#"],[5,4,4,"C"],[6,2,2,"F#"]], ["x","x","o","o","o","x"], null, "aberto")],
            "D": [shape(1, [[4,0,0,"D"],[5,1,1,"G#"],[6,1,2,"F"]], ["x","x","o","o","o","o"], null, "aberto")],
            "E": [shape(1, [[3,3,3,"A#"],[4,2,2,"E"],[5,2,1,"G"]], ["x","x","o","o","o","x"], null, "aberto")],
            "G": [shape(1, [[4,0,0,"G"],[5,2,1,"C#"],[6,3,2,"A#"]], ["x","x","o","o","o","o"], null, "aberto")],
            "A": [shape(1, [[3,2,2,"D#"],[4,2,3,"A"],[5,1,1,"C"]], ["x","o","o","o","o","x"], null, "aberto")],
            "B": [shape(1, [[2,2,2,"B"],[4,3,4,"F"],[5,1,1,"D"]], ["x","o","x","o","o","x"], null, "aberto")]
        };

        // ---------- ESCALAS (fórmulas) ----------
        const ESCALAS_FORMULAS = {
            "Maior Natural": [0,2,4,5,7,9,11],
            "Menor Natural": [0,2,3,5,7,8,10],
            "Menor Harmônica": [0,2,3,5,7,8,11],
            "Menor Melódica": [0,2,3,5,7,9,11],
            "Pentatônica Maior": [0,2,4,7,9],
            "Pentatônica Menor": [0,3,5,7,10],
            "Jônio": [0,2,4,5,7,9,11],
            "Dórico": [0,2,3,5,7,9,10],
            "Frígio": [0,1,3,5,7,8,10],
            "Lídio": [0,2,4,6,7,9,11],
            "Mixolídio": [0,2,4,5,7,9,10],
            "Eólio": [0,2,3,5,7,8,10],
            "Lócrio": [0,1,3,5,6,8,10],
            "Cigana Húngara": [0,2,3,6,7,8,11],
            "Árabe Dominante": [0,1,4,5,7,8,10],
            "Húngara Maior": [0,3,4,6,7,9,10],
            "Blues": [0,3,5,6,7,10],
            "Tons Inteiros": [0,2,4,6,8,10],
            "Diminuta (Octatônica)": [0,2,3,5,6,8,9,11],
            "Bebop Maior": [0,2,4,5,7,8,9,11]
        };

        // ---------- DEDILHADO DA MÃO DIREITA ----------
        // Numeração: 1 = polegar, 2 = indicador, 3 = médio, 4 = anelar, 5 = mínimo.
        // Linhas do diagrama (0 a 5) = E, A, D, G, B, E (grave -> aguda).
        //   - Polegar (1): entre as 3 cordas mais graves (E, A, D), a primeira
        //     que não estiver abafada ("x") -- ali está o baixo do acorde.
        //   - Indicador (2) = corda G, Médio (3) = corda B, Anelar (4) = corda E aguda,
        //     cada um só aparece se a corda não estiver abafada.
        //   - Mínimo (5) fica de fora: um acorde de 6 cordas só precisa de 4 dedos
        //     (polegar + indicador + médio + anelar) tocando uma corda cada.
        function acharDedosMaoDireita(chord) {
            const dedos = {};
            for (let i = 0; i <= 2; i++) {
                if (chord.status && chord.status[i] === 'x') continue;
                dedos[i] = 1;
                break;
            }
            [[3, 2], [4, 3], [5, 4]].forEach(([linha, dedo]) => {
                if (!chord.status || chord.status[linha] !== 'x') dedos[linha] = dedo;
            });
            return dedos;
        }

        // ---------- GERADOR SVG (acordes) ----------
        function gerarSvgAcorde(tonica, chord, largura = 480, altura = 190) {
            const margemEsquerda = 50, margemSuperior = 32;
            const espCordas = 26, espCasas = 68;
            const numCasas = 9;

            let svg = `<svg width="${largura}" height="${altura}" viewBox="0 0 ${largura} ${altura}" xmlns="http://www.w3.org/2000/svg">`;
            svg += `<rect width="100%" height="100%" fill="#121212" rx="6"/>`;

            const dedosDireita = acharDedosMaoDireita(chord);

            const peso = (chord.baseFret === 1) ? 4 : 1.8;
            svg += `<line x1="${margemEsquerda}" y1="${margemSuperior}" x2="${margemEsquerda}" y2="${margemSuperior + (espCordas*5)}" stroke="#888" stroke-width="${peso}" stroke-linecap="round"/>`;

            for (let i=1; i<=numCasas; i++) {
                let x = margemEsquerda + i*espCasas;
                let casaReal = chord.baseFret + i - 1;
                svg += `<line x1="${x}" y1="${margemSuperior}" x2="${x}" y2="${margemSuperior + (espCordas*5)}" stroke="#3a3a3a" stroke-width="1.5"/>`;
                svg += `<text x="${x - espCasas/2}" y="${margemSuperior - 12}" font-family="'Inter',Arial" font-size="9" fill="#666" text-anchor="middle">${casaReal}</text>`;
            }

            for (let c=0; c<6; c++) {
                let y = margemSuperior + c*espCordas;
                svg += `<line x1="${margemEsquerda}" y1="${y}" x2="${margemEsquerda + numCasas*espCasas}" y2="${y}" stroke="#4a4a4a" stroke-width="1.2"/>`;
                svg += `<text x="${margemEsquerda-20}" y="${y+5}" font-family="'Inter',Arial" font-size="10" font-weight="600" fill="#888" text-anchor="middle">${AFINACAO[c]}</text>`;

                const dedo = dedosDireita[c];
                if (dedo !== undefined) {
                    svg += `<circle cx="${largura-12}" cy="${y}" r="7" fill="#c9a959"/>`;
                    svg += `<text x="${largura-12}" y="${y+3}" font-family="'Inter',Arial" font-size="8" font-weight="700" fill="#0a0a0a" text-anchor="middle">${dedo}</text>`;
                }
            }

            if (chord.barre) {
                let b = chord.barre;
                let xPos = margemEsquerda + b.fret*espCasas - espCasas/2;
                let yIni = margemSuperior + (b.from-1)*espCordas;
                let yFim = margemSuperior + (b.to-1)*espCordas;
                svg += `<rect x="${xPos-5}" y="${yIni-3}" width="10" height="${yFim-yIni+6}" rx="4" fill="#e0e0e0" opacity="0.7"/>`;
            }

            chord.dots.forEach(d => {
                let cordaIdx = d[0]-1, casaIdx = d[1], dedo = d[2], nota = d[3]||'';
                let cx = margemEsquerda + casaIdx*espCasas - espCasas/2;
                let cy = margemSuperior + cordaIdx*espCordas;
                let isTonica = (nota === tonica);
                let cor = isTonica ? '#c9a959' : '#f0f0f0';
                let textoCor = isTonica ? '#0a0a0a' : '#0a0a0a';
                svg += `<circle cx="${cx}" cy="${cy}" r="8" fill="${cor}" stroke="${isTonica ? '#c9a959' : '#555'}" stroke-width="0.8"/>`;
                svg += `<text x="${cx}" y="${cy+3}" font-family="'Inter',Arial" font-size="8" font-weight="700" fill="${textoCor}" text-anchor="middle">${dedo}</text>`;
            });

            if (chord.status) {
                chord.status.forEach((st,i) => {
                    if (st === 'x' || st === 'o') {
                        let y = margemSuperior + i*espCordas + 4;
                        let cor = st==='x' ? '#ff5555' : '#66d966';
                        svg += `<text x="${margemEsquerda + numCasas*espCasas + 16}" y="${y+5}" font-family="'Inter',Arial" font-size="13" font-weight="700" fill="${cor}" text-anchor="middle">${st.toUpperCase()}</text>`;
                    }
                });
            }

            svg += `</svg>`;
            return svg;
        }

        // ---------- POSIÇÃO INICIAL DA ESCALA ----------
        // A escala sempre começa na tônica mais grave possível no violão:
        // a posição dela na corda mais grave (E), calculada por módulo.
        // Ex.: tônica A -> 5ª casa da corda E (não existe A mais grave que essa
        // no braço em afinação padrão).
        function acharBaseFretEscala(tonica) {
            const idxGrave = NOTAS.indexOf(AFINACAO[0]);
            const idxTonica = NOTAS.indexOf(tonica);
            return (idxTonica - idxGrave + 12) % 12;
        }

        // ---------- DEDILHADO DA MÃO DIREITA (escalas) ----------
        // Numeração: 1 = polegar, 2 = indicador, 3 = médio, 4 = anelar, 5 = mínimo.
        // Diferente dos acordes, a escala não abafa cordas -- normalmente as
        // 6 participam. Por isso a regra aqui é fixa por corda (E/A/D sempre
        // com o polegar, já que numa escala o baixo caminha pelas 3 cordas
        // graves), e só aparece o número se aquela corda realmente tiver
        // alguma nota da escala dentro do trecho mostrado (a partir de baseFret).
        function acharDedosMaoDireitaEscala(notasDaEscala, numCasas, baseFret) {
            const mapaDedo = { 0: 1, 1: 1, 2: 1, 3: 2, 4: 3, 5: 4 };
            const dedos = {};
            for (let c = 0; c < 6; c++) {
                const idxBase = NOTAS.indexOf(AFINACAO[c]);
                let temNota = false;
                for (let casa = 0; casa <= numCasas; casa++) {
                    if (notasDaEscala.includes(NOTAS[(idxBase + baseFret + casa) % 12])) { temNota = true; break; }
                }
                if (temNota) dedos[c] = mapaDedo[c];
            }
            return dedos;
        }

        // ---------- GERADOR SVG (escalas) ----------
        // baseFretOverride: usado pelas outras posições da escala (gerarPosicoesEscala).
        // Quando omitido, desenha a posição 1 (começando na tônica mais grave).
        function gerarSvgEscala(tonica, notasDaEscala, largura = 480, altura = 190, baseFretOverride = null) {
            const margemEsquerda = 50, margemSuperior = 32;
            const espCordas = 26, espCasas = 68;
            const numCasas = 5;

            const baseFret = (baseFretOverride !== null) ? baseFretOverride : acharBaseFretEscala(tonica);

            let svg = `<svg width="${largura}" height="${altura}" viewBox="0 0 ${largura} ${altura}" xmlns="http://www.w3.org/2000/svg">`;
            svg += `<rect width="100%" height="100%" fill="#121212" rx="6"/>`;

            const dedosDireita = acharDedosMaoDireitaEscala(notasDaEscala, numCasas, baseFret);

            const peso = (baseFret === 0) ? 4 : 1.8;
            svg += `<line x1="${margemEsquerda}" y1="${margemSuperior}" x2="${margemEsquerda}" y2="${margemSuperior + (espCordas*5)}" stroke="#888" stroke-width="${peso}" stroke-linecap="round"/>`;

            if (baseFret > 0) {
                svg += `<text x="${margemEsquerda}" y="${margemSuperior - 12}" font-family="'Inter',Arial" font-size="9" fill="#c9a959" text-anchor="middle">${baseFret}ª</text>`;
            }

            for (let i=1; i<=numCasas; i++) {
                let x = margemEsquerda + i*espCasas;
                let casaReal = baseFret + i;
                svg += `<line x1="${x}" y1="${margemSuperior}" x2="${x}" y2="${margemSuperior + (espCordas*5)}" stroke="#3a3a3a" stroke-width="1.5"/>`;
                svg += `<text x="${x - espCasas/2}" y="${margemSuperior - 12}" font-family="'Inter',Arial" font-size="9" fill="#666" text-anchor="middle">${casaReal}ª</text>`;
            }

            for (let c=0; c<6; c++) {
                let y = margemSuperior + c*espCordas;
                svg += `<line x1="${margemEsquerda}" y1="${y}" x2="${margemEsquerda + numCasas*espCasas}" y2="${y}" stroke="#4a4a4a" stroke-width="1.2"/>`;
                svg += `<text x="${margemEsquerda-20}" y="${y+5}" font-family="'Inter',Arial" font-size="10" font-weight="600" fill="#888" text-anchor="middle">${AFINACAO[c]}</text>`;

                const dedo = dedosDireita[c];
                if (dedo !== undefined) {
                    svg += `<circle cx="${largura-12}" cy="${y}" r="7" fill="#c9a959"/>`;
                    svg += `<text x="${largura-12}" y="${y+3}" font-family="'Inter',Arial" font-size="8" font-weight="700" fill="#0a0a0a" text-anchor="middle">${dedo}</text>`;
                }
            }

            for (let c=0; c<6; c++) {
                let idxBase = NOTAS.indexOf(AFINACAO[c]);
                for (let casa=0; casa<=numCasas; casa++) {
                    let idxNota = (idxBase + baseFret + casa) % 12;
                    let notaAtual = NOTAS[idxNota];
                    if (notasDaEscala.includes(notaAtual)) {
                        let cx = margemEsquerda + casa*espCasas - (casa===0 ? 0 : espCasas/2);
                        let cy = margemSuperior + c*espCordas;
                        let isTonica = (notaAtual === tonica);
                        let cor = isTonica ? '#c9a959' : '#f0f0f0';
                        let textoCor = isTonica ? '#0a0a0a' : '#0a0a0a';
                        let raio = (casa===0) ? 7 : 9;
                        svg += `<circle cx="${cx}" cy="${cy}" r="${raio}" fill="${cor}" stroke="${isTonica ? '#c9a959' : '#555'}" stroke-width="0.8"/>`;
                        svg += `<text x="${cx}" y="${cy+3}" font-family="'Inter',Arial" font-size="7" font-weight="700" fill="${textoCor}" text-anchor="middle">${notaAtual}</text>`;
                    }
                }
            }

            svg += `</svg>`;
            return svg;
        }

        // ---------- TODAS AS POSIÇÕES DA ESCALA NO BRAÇO ----------
        // A mesma escala pode começar em qualquer um dos seus graus, não só
        // na tônica -- é a mesma "forma" repetida em casas diferentes,
        // cobrindo o braço inteiro (do 1º grau, mais grave, até o último).
        // Gera 1 posição por grau da fórmula, ancorada onde aquele grau
        // aparece na corda mais grave (E), ordenadas da mais grave pra mais
        // aguda.
        function gerarPosicoesEscala(tonica, notasDaEscala, formula) {
            const idxTonica = NOTAS.indexOf(tonica);

            const candidatas = formula.map((intervalo, i) => {
                const notaGrau = NOTAS[(idxTonica + intervalo) % 12];
                return { grau: i + 1, notaGrau, baseFret: acharBaseFretEscala(notaGrau) };
            });

            const vistos = new Set();
            const ordenadas = candidatas
                .sort((a, b) => a.baseFret - b.baseFret)
                .filter(p => {
                    if (vistos.has(p.baseFret)) return false;
                    vistos.add(p.baseFret);
                    return true;
                });

            return ordenadas.map((p, i) => ({
                posicao: i + 1,
                total: ordenadas.length,
                notaGrau: p.notaGrau,
                grau: p.grau,
                baseFret: p.baseFret,
                svg: gerarSvgEscala(tonica, notasDaEscala, 480, 190, p.baseFret)
            }));
        }

        // ---------- MONTAGEM DOS ITENS ----------
        const items = [];

        // 1. Acordes
        for (let [tipo, mapa] of Object.entries(ACORDES_BIBLIOTECA)) {
            for (let [tonica, formas] of Object.entries(mapa)) {
                formas.forEach((f, idx) => {
                    let nome = `${tonica} ${tipo}`;
                    let badge = tipo;
                    let cat = 'triade';
                    if (tipo.includes('Sétima') || tipo.includes('7')) cat = 'tetrade';
                    if (tipo.includes('Dominante')) cat = 'dominante';
                    if (tipo.includes('Diminuto')) cat = 'diminuto';
                    if (tipo.includes('Suspenso')) cat = 'suspenso';
                    if (tipo.includes('Nona') || tipo.includes('11') || tipo.includes('13') || tipo.includes('6/9')) cat = 'extensao';

                    let notas = f.dots.map(d => d[3] || '').filter(Boolean);
                    let notasStr = notas.join(' · ');

                    let svg = gerarSvgAcorde(tonica, f);

                    items.push({
                        tipo: 'acorde',
                        nome: nome,
                        badge: badge,
                        categoria: cat,
                        notas: notasStr,
                        svg: svg,
                        tonica: tonica,
                        forma: f,
                        tituloModal: nome,
                        badgeModal: badge
                    });
                });
            }
        }

        // 2. Escalas
        for (let [nomeEscala, formula] of Object.entries(ESCALAS_FORMULAS)) {
            NOTAS.forEach(tonica => {
                let idxT = NOTAS.indexOf(tonica);
                let notas = formula.map(intervalo => NOTAS[(idxT + intervalo) % 12]);
                let notasUnicas = [...new Set(notas)];
                let cat = 'modo';
                if (nomeEscala.includes('Cigana') || nomeEscala.includes('Árabe') || nomeEscala.includes('Húngara')) cat = 'exotica';
                if (nomeEscala.includes('Blues') || nomeEscala.includes('Tons') || nomeEscala.includes('Diminuta') || nomeEscala.includes('Bebop')) cat = 'exotica';
                if (nomeEscala.includes('Pentatônica')) cat = 'triade';

                let posicoes = gerarPosicoesEscala(tonica, notasUnicas, formula);
                items.push({
                    tipo: 'escala',
                    nome: `${tonica} ${nomeEscala}`,
                    badge: nomeEscala,
                    categoria: cat,
                    notas: notasUnicas.join(' · '),
                    svg: posicoes[0].svg,
                    posicoes: posicoes,
                    tonica: tonica,
                    tituloModal: `${tonica} · ${nomeEscala}`,
                    badgeModal: 'Escala'
                });
            });
        }

        // ---------- RENDERIZAÇÃO ----------
        const container = document.getElementById('galleryContainer');
        const visibleSpan = document.getElementById('visibleCount');
        const totalSpan = document.getElementById('totalCount');
        let currentFilter = 'all';
        let currentView = 'acorde'; // 'acorde', 'escala', 'todos'

        function render(filter = 'all', view = currentView) {
            let filtered = items;

            // Filtro por tipo (acorde/escala/todos)
            if (view === 'acorde') {
                filtered = filtered.filter(it => it.tipo === 'acorde');
            } else if (view === 'escala') {
                filtered = filtered.filter(it => it.tipo === 'escala');
            }
            // 'todos' não filtra por tipo

            // Filtro por categoria
            if (filter !== 'all') {
                filtered = filtered.filter(it => it.categoria === filter);
            }

            visibleSpan.textContent = filtered.length;
            totalSpan.textContent = items.length;

            if (filtered.length === 0) {
                container.innerHTML = `<div class="col-12 text-center py-4 text-muted"><i class="fas fa-search fa-2x mb-2 d-block"></i>Nenhum item encontrado para este filtro.</div>`;
                return;
            }

            let html = '';
            filtered.forEach((item, idx) => {
                let col = 'col-6 col-md-4 col-lg-3';
                html += `
                    <div class="${col}">
                        <div class="card-chord" data-index="${idx}" data-bs-toggle="modal" data-bs-target="#modalDetalhe">
                            <div class="svg-wrapper">${item.svg}</div>
                            <div class="chord-name">${item.nome}</div>
                            <div class="chord-notes">${item.notas}</div>
                            <span class="chord-badge">${item.badge}</span>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;

            window._modalItems = filtered;
        }

        // ----- FILTROS -----
        document.querySelectorAll('.btn-filter').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                render(currentFilter, currentView);
            });
        });

        // ----- TOGGLE VIEW -----
        document.getElementById('btnViewAcorde').addEventListener('click', function() {
            document.querySelectorAll('.btn-toggle').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentView = 'acorde';
            render(currentFilter, currentView);
        });
        document.getElementById('btnViewEscala').addEventListener('click', function() {
            document.querySelectorAll('.btn-toggle').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentView = 'escala';
            render(currentFilter, currentView);
        });
        document.getElementById('btnViewTodos').addEventListener('click', function() {
            document.querySelectorAll('.btn-toggle').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentView = 'todos';
            render(currentFilter, currentView);
        });

        // ----- MODAL -----
        const modal = document.getElementById('modalDetalhe');
        const modalSvgContainer = document.getElementById('modalSvgContainer');
        const modalPosicoes = document.getElementById('modalPosicoes');
        const modalPosicoesBtns = document.getElementById('modalPosicoesBtns');
        const modalPosicaoInfo = document.getElementById('modalPosicaoInfo');

        function mostrarPosicao(item, i) {
            const p = item.posicoes[i];
            modalSvgContainer.innerHTML = p.svg;
            modalPosicoesBtns.querySelectorAll('.btn-posicao').forEach((b, bi) => {
                b.classList.toggle('active', bi === i);
            });
            const casa = p.baseFret === 0 ? 'aberta' : `${p.baseFret}ª casa`;
            modalPosicaoInfo.textContent = `Posição ${p.posicao} de ${p.total} — começa em ${p.notaGrau} (${casa})`;
        }

        modal.addEventListener('show.bs.modal', function(e) {
            const card = e.relatedTarget;
            const idx = parseInt(card.dataset.index);
            const itemsList = window._modalItems || [];
            const item = itemsList[idx];
            if (!item) return;

            document.getElementById('modalTitle').textContent = item.tituloModal || item.nome;
            document.getElementById('modalBadge').textContent = item.badgeModal || item.badge;
            document.getElementById('modalNotes').textContent = item.notas || '';

            if (item.tipo === 'escala' && item.posicoes && item.posicoes.length > 1) {
                modalPosicoes.classList.remove('d-none');
                modalPosicoesBtns.innerHTML = item.posicoes
                    .map((p, i) => `<button type="button" class="btn-posicao" data-i="${i}">${p.posicao}</button>`)
                    .join('');
                modalPosicoesBtns.querySelectorAll('.btn-posicao').forEach(btn => {
                    btn.addEventListener('click', () => mostrarPosicao(item, parseInt(btn.dataset.i)));
                });
                mostrarPosicao(item, 0);
            } else {
                modalPosicoes.classList.add('d-none');
                modalPosicoesBtns.innerHTML = '';
                modalSvgContainer.innerHTML = item.svg;
            }
        });

        // ----- INICIALIZA -----
        // Começa com "Acordes" ativo
        document.getElementById('btnViewAcorde').classList.add('active');
        render('all', 'acorde');

        console.log(`✅ Dicionário carregado: ${items.length} itens (${items.filter(i=>i.tipo==='acorde').length} acordes, ${items.filter(i=>i.tipo==='escala').length} escalas)`);
    </script>

    <script src="js/js/layout.js"></script>
</body>
</html>
