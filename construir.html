    <style>
        /* ===== ESTILOS GERAIS INTEGRADOS ===== */
        body {
            background: #0e0d1a;
            color: #e4dfd7;
            font-family: 'Inter', sans-serif;
            padding-top: 90px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .gold {
            color: #e8d5a3;
        }
        .bg-dark-custom {
            background: #14131f;
        }
        .border-gold {
            border-color: rgba(201, 169, 89, 0.3) !important;
        }
        .text-gold {
            color: #e8d5a3;
        }
        .text-muted {
            color: #b5b0a8 !important;
        }

        /* ===== NAVBAR ===== */
        .navbar-custom {
            background: #0e0d1aee;
            backdrop-filter: blur(6px);
            border-bottom: 1px solid rgba(201, 169, 89, 0.15);
        }
        .navbar-custom .nav-link {
            color: #d1cbdc !important;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .navbar-custom .nav-link:hover,
        .navbar-custom .nav-link.active {
            color: #e8d5a3 !important;
        }
        .nav-brand-title {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #e8d5a3 !important;
            text-decoration: none;
        }

        .chapter-content {
            flex: 1;
            padding: 2rem 0;
        }
        .section-tag {
            display: inline-block;
            background: rgba(201, 169, 89, 0.12);
            color: #e8d5a3;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.8px;
            padding: 5px 16px;
            border-radius: 30px;
            border: 1px solid rgba(201, 169, 89, 0.25);
            text-transform: uppercase;
        }

        /* ===== CONTAINER DO JOGO ===== */
        .game-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(201, 169, 89, 0.25);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            transition: 0.3s ease;
        }
        
        .level-badge {
            background: rgba(201, 169, 89, 0.2);
            color: #ffffff;
            border: 1px solid #e8d5a3;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 6px 18px;
            border-radius: 50px;
        }

        /* ===== PROGRESS BAR ===== */
        .progress-container {
            height: 12px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(201, 169, 89, 0.2);
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #c9a959, #f7e7c4);
            width: 0%;
            transition: width 0.4s ease;
        }

        /* ===== PERGUNTA ===== */
        .question-text {
            font-family: 'Playfair Display', serif;
            font-size: 1.9rem;
            color: #ffffff;
            margin: 25px 0;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* ===== BOTÕES DE RESPOSTA ===== */
        .option-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(201, 169, 89, 0.35);
            color: #ffffff !important;
            padding: 16px 20px;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            border-radius: 10px;
            transition: all 0.2s ease;
            width: 100%;
            margin-bottom: 15px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }
        .option-btn:hover {
            background: rgba(201, 169, 89, 0.25);
            border-color: #f7e7c4;
            color: #ffffff !important;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(201, 169, 89, 0.2);
        }

        /* ===== FEEDBACK ===== */
        .feedback-area {
            min-height: 60px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            font-weight: 600;
            transition: all 0.3s ease;
            opacity: 0;
        }
        .feedback-area.show {
            opacity: 1;
        }
        .option-btn.wrong {
            opacity: 0.45;
            text-decoration: line-through;
            border-color: #ff5555;
        }
        .feedback-correct {
            background: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
            border: 1px solid rgba(46, 204, 113, 0.4);
        }
        .feedback-incorrect {
            background: rgba(231, 76, 60, 0.2);
            color: #ff6b6b;
            border: 1px solid rgba(231, 76, 60, 0.4);
        }

        /* ===== SELETOR DE NÍVEIS LATERAL ===== */
        .btn-level-select {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(201, 169, 89, 0.15);
            color: #e4dfd7;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: 0.2s;
            text-align: left;
            width: 100%;
            margin-bottom: 8px;
        }
        .btn-level-select .level-title {
            color: #ffffff;
            font-weight: 600;
        }
        .btn-level-select .level-desc {
            color: #b5b0a8;
            font-size: 0.8rem;
            margin-top: 2px;
        }
        .btn-level-select:hover, .btn-level-select.active {
            background: rgba(201, 169, 89, 0.15);
            border-color: #e8d5a3;
        }
        .btn-level-select.active .level-title {
            color: #e8d5a3;
        }

        /* ===== FOOTER ===== */
        .site-footer {
            border-top: 1px solid rgba(201, 169, 89, 0.1);
            background: #0e0d1a;
            padding: 1.5rem 0;
        }
        .site-footer .footer-brand {
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            color: #e8d5a3;
        }

        @media (max-width: 576px) {
            body {
                padding-top: 68px;
            }
            .chapter-content {
                padding: 1.25rem 0 1.75rem;
            }
            .game-card {
                padding: 18px 14px;
                border-radius: 12px;
            }
            .question-text {
                font-size: 1.35rem;
                margin: 16px 0;
                min-height: 56px;
            }
            .option-btn {
                padding: 12px 14px;
                font-size: 1rem;
                margin-bottom: 10px;
            }
            .feedback-area {
                min-height: 50px;
                font-size: 1rem;
            }
        }

        @media (max-width: 430px) {
            .level-badge {
                font-size: 0.78rem;
                padding: 5px 12px;
            }
            .question-text {
                font-size: 1.2rem;
                margin: 12px 0;
                min-height: 48px;
            }
            .option-btn {
                padding: 11px 12px;
                font-size: 0.95rem;
            }
            .row.g-4 {
                --bs-gutter-y: 0.85rem;
            }
        }

        @media (max-width: 390px) {
            .game-card {
                padding: 14px 11px;
            }
            .feedback-area {
                min-height: 46px;
                font-size: 0.93rem;
            }
            .btn-level-select .level-desc {
                font-size: 0.75rem;
            }
        }

        @media (max-width: 360px) {
            .section-tag {
                font-size: 0.68rem;
                padding: 4px 12px;
            }
            .btn-level-select {
                padding: 10px 12px;
            }
        }
    </style>

<body>

    <div id="site-navbar"></div>

    <main class="chapter-content">
        <div class="container">
            <div class="text-center mb-4">
                <span class="section-tag"><i class="fas fa-hammer me-1"></i> Exercícios de Construção</span>
                <h1 class="display-5 fw-bold mt-2">Construir <span class="gold">Acordes e Escalas</span></h1>
                <p class="text-muted mb-0">Marque as notas certas, confira e memorize a fórmula. São 12 tons e todos os tipos.</p>
            </div>

            <div class="build-tabs">
                <button type="button" class="build-tab active" data-kind="acordes"><i class="fas fa-guitar me-1"></i> Acordes</button>
                <button type="button" class="build-tab" data-kind="escalas"><i class="fas fa-stairs me-1"></i> Escalas</button>
            </div>

            <div class="game-card">
                <div class="row g-3 build-controls align-items-end">
                    <div class="col-6 col-md-3">
                        <label class="form-label small text-muted" for="selTom">Tom</label>
                        <select id="selTom" class="form-select"></select>
                    </div>
                    <div class="col-6 col-md-5">
                        <label class="form-label small text-muted" for="selTipo">Tipo</label>
                        <select id="selTipo" class="form-select"></select>
                    </div>
                    <div class="col-12 col-md-4 text-md-end">
                        <button type="button" class="btn btn-outline-warning" id="btnRandom"><i class="fas fa-dice me-1"></i> Sortear</button>
                    </div>
                </div>

                <h2 class="build-title" id="buildTitle"></h2>
                <p class="build-sub" id="buildSub"></p>

                <div class="keys" id="keys" role="group" aria-label="Notas"></div>

                <div class="build-actions">
                    <button type="button" class="btn btn-gold" id="btnCheck" style="background:#e8d5a3;color:#0e0d1a;font-weight:600"><i class="fas fa-check me-1"></i> Verificar</button>
                    <button type="button" class="btn btn-outline-light" id="btnClear"><i class="fas fa-eraser me-1"></i> Limpar</button>
                    <button type="button" class="btn btn-outline-light" id="btnReveal"><i class="fas fa-eye me-1"></i> Mostrar resposta</button>
                    <button type="button" class="btn btn-outline-light" id="btnListen"><i class="fas fa-volume-high me-1"></i> Ouvir</button>
                    <button type="button" class="btn btn-gold d-none" id="btnNext" style="background:#e8d5a3;color:#0e0d1a;font-weight:600">Próximo desafio <i class="fas fa-arrow-right ms-1"></i></button>
                </div>

                <div class="build-result" id="buildResult" aria-live="polite"></div>
                <small class="text-muted d-block text-center mt-3">Você tem 2 chances. Se errar as duas, a resposta aparece em verde para você memorizar.</small>
            </div>

            <details class="game-card mt-4">
                <summary class="fw-bold" style="cursor:pointer;color:#e8d5a3" id="refTitle">Todos os acordes neste tom</summary>
                <div class="mt-3 table-responsive" id="refBody"></div>
            </details>
        </div>
    </main>

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <script src="js/js/construir.js"></script>
    <script src="js/js/layout.js"></script>
</body>
