<body data-inst="violao,guitarra,baixo">

    <div id="site-navbar"></div>

    <!-- ===== CONTEÚDO PRINCIPAL ===== -->
    <main class="chapter-content">
<div class="container">
<div class="row mb-4"><div class="col-12 text-center">
<span class="section-tag"><i class="fas fa-sliders me-1"></i> Ferramenta</span>
<h1 class="display-5 fw-bold mt-2">Afinador <span class="gold">online</span></h1>
<p class="text-muted">Use o microfone do celular ou do computador. Toque uma corda solta e ajuste até o ponteiro ficar no centro.</p></div></div>
<div class="row justify-content-center mb-3"><div class="col-lg-4 col-md-6"><label class="small text-muted" for="inst">Instrumento</label><select id="inst" class="form-select"><option value="violao">Violão</option><option value="guitarra">Guitarra</option><option value="baixo">Baixo (4 cordas)</option></select></div></div>
<div class="row g-4 justify-content-center"><div class="col-lg-8"><div class="game-card text-center">
<div class="fs-1 gold fw-bold" id="nota">--</div>
<div class="text-muted mb-3" id="hz">Toque uma corda</div>
<svg viewBox="0 0 300 70" style="max-width:420px;width:100%"><line x1="150" y1="8" x2="150" y2="62" stroke="#6b6780" stroke-dasharray="3 3"/>
<rect x="135" y="30" width="30" height="10" rx="5" fill="#2a2840"/><rect x="10" y="34" width="280" height="2" fill="#6b6780"/>
<line id="agulha" x1="150" y1="10" x2="150" y2="60" stroke="#e8d5a3" stroke-width="4" stroke-linecap="round" style="transition:transform .15s;transform-origin:150px 35px"/></svg>
<div class="fw-bold fs-5 mb-3" id="dica">&nbsp;</div>
<button class="btn fw-bold px-4 py-2" id="mic" style="background:#c9a959;color:#0e0d1a;border-radius:12px"><i class="fas fa-microphone me-2"></i>Ativar microfone</button>
<hr class="border-gold my-4"><div class="small text-muted mb-2">Sem microfone? Toque a nota de referência e afine de ouvido.</div>
<div class="d-flex flex-wrap justify-content-center gap-2" id="cordas"></div>
</div></div></div>
</div>
</main>

    <div id="site-footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/js/layout.js"></script>
    <script src="js/js/violao.js"></script>
    <script>

const INS={violao:{s:[['6ª E',40],['5ª A',45],['4ª D',50],['3ª G',55],['2ª B',59],['1ª E',64]],som:'nylon'},
 guitarra:{s:[['6ª E',40],['5ª A',45],['4ª D',50],['3ª G',55],['2ª B',59],['1ª E',64]],som:'guitarra'},
 baixo:{s:[['4ª E',28],['3ª A',33],['2ª D',38],['1ª G',43]],som:'baixo'}};
const N=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const $=id=>document.getElementById(id);let ctx,tim;
// referência: o som do próprio violão, repetido até tocar de novo no botão
function para(){clearInterval(tim);tim=null;Violao.stop();document.querySelectorAll('.corda').forEach(x=>{x.dataset.on='';x.classList.remove('on')});}
function monta(){para();$('cordas').innerHTML='';const I=INS[$('inst').value];I.s.forEach(([n,m])=>{const b=document.createElement('button');b.className='btn btn-outline-light corda';b.textContent=n;b.onclick=()=>{
 const era=b.dataset.on;para();if(era)return;
 const toca=()=>Violao.note(m,{v:.9,ch:0,inst:I.som});toca();tim=setInterval(toca,3000);b.dataset.on='1';b.classList.add('on');};$('cordas').appendChild(b);});}
try{const v=localStorage.getItem('instrumento');if(v==='guitarra'||v==='baixo')$('inst').value=v;}catch(e){}
$('inst').onchange=monta;monta();
function pitch(buf,sr){let rms=0;for(const v of buf)rms+=v*v;if(Math.sqrt(rms/buf.length)<.01)return -1;
 const max=Math.floor(sr/($('inst').value==='baixo'?35:60)),min=Math.floor(sr/500);let best=-1,bc=0;const c=new Float32Array(max+1);
 for(let l=min;l<=max;l++){let s=0;for(let i=0;i<buf.length-l;i++)s+=buf[i]*buf[i+l];c[l]=s;}
 let l=min;while(l<max&&c[l]>c[l+1])l++;for(;l<=max;l++)if(c[l]>bc){bc=c[l];best=l;}
 if(best<1)return -1;const a=c[best-1],b=c[best],d=c[best+1]||b;const sh=(a-d)/(2*(a-2*b+d))||0;return sr/(best+sh);}
$('mic').onclick=async()=>{try{const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
 ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();const an=ctx.createAnalyser();an.fftSize=4096;ctx.createMediaStreamSource(st).connect(an);
 const buf=new Float32Array(an.fftSize);$('mic').style.display='none';
 (function loop(){an.getFloatTimeDomainData(buf);const f=pitch(buf,ctx.sampleRate);
  if(f>0){const m=69+12*Math.log2(f/440),r=Math.round(m),ct=Math.round((m-r)*100);
   $('nota').textContent=N[((r%12)+12)%12]+Math.floor(r/12-1);$('hz').textContent=f.toFixed(1)+' Hz · '+(ct>0?'+':'')+ct+' cents';
   $('agulha').style.transform='rotate('+Math.max(-45,Math.min(45,ct*.9))+'deg)';
   $('dica').textContent=Math.abs(ct)<=5?'Afinado':(ct<0?'Aperte a corda (sobe)':'Solte a corda (desce)');$('dica').style.color=Math.abs(ct)<=5?'#8fd18f':'#e8d5a3';}
  requestAnimationFrame(loop);})();
 }catch(e){$('dica').textContent='Não consegui acessar o microfone. Libere a permissão no navegador (precisa de https).';}};
</script>
